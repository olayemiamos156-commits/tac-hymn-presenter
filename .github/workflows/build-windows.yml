name: Build TAC Hymn Presenter for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build Windows application
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "TAC Hymn Presenter" tac_hymn_presenter.py

      - name: Include hymn data
        run: |
          copy hymns.json "dist\hymns.json"
          copy README.txt "dist\README.txt"

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: TAC-Hymn-Presenter-Windows
          path: dist/*
